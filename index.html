<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>studioby.malu — Ficha de Anamnese</title>
<style>
:root{--ink:#2d241f;--brown:#3b2c25;--beige:#eee5da;--line:#b9a897;--champ:#c7b092}
*{box-sizing:border-box}
body{margin:0;background:#e9e2da;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#faf7f2;border:1px solid #b8a694;box-shadow:0 5px 25px #0001;padding:24px;border-radius:10px}
.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.logoMark{width:54px;height:54px;border:2px solid #b9a58e;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-family:Georgia,serif;font-size:25px}
.brandName{font:700 30px Georgia,serif;letter-spacing:-1px}.brandSub{letter-spacing:6px;font-size:11px;margin-top:6px}
h1{font:700 21px Georgia,serif;margin:18px 0 12px;color:var(--brown)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-family:Georgia,"Times New Roman",serif;font-size:13px;font-weight:600;letter-spacing:.55px;line-height:1.3;color:var(--brown)}
input,textarea,select{width:100%;font:15px Arial,sans-serif;border:1px solid #b8a99b;background:white;border-radius:7px;padding:10px 12px;color:#2d241f;height:43px}
input[type="date"]{height:43px;line-height:21px;padding:10px 12px}
textarea{min-height:85px;height:auto;resize:vertical}
.check{font-family:Arial,Helvetica,sans-serif;font-weight:400}
.consentText{font-family:Arial,Helvetica,sans-serif;font-weight:400}
select{appearance:auto}
input[type="radio"]{accent-color:#806a57}
.section{border:1px solid #c8b9a9;padding:15px;border-radius:8px;margin-top:15px}
.sectionTitle{font:700 16px Georgia,serif;letter-spacing:1px;margin-bottom:10px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.3}
.check input{width:21px;height:21px;min-width:21px;margin:0;accent-color:#806a57}
.consent{margin-top:18px;border:2px solid #a98d70;background:#f4eee6;border-radius:8px;padding:15px}
.consentRow{display:flex;gap:11px;align-items:flex-start}
.consentRow input{width:24px;height:24px;min-width:24px;margin:1px 0 0;accent-color:#72583f}
.consentText{font-size:14px;line-height:1.45}.consentText strong{display:block;margin-bottom:5px}
.actions{position:sticky;bottom:0;background:#faf7f2;padding-top:14px;margin-top:18px}
button{width:100%;border:0;border-radius:8px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#382b24;color:#fff}.primary:disabled{opacity:.55}
.status{display:none;margin-top:12px;padding:13px;border-radius:8px;background:#eee5da;font-size:14px;line-height:1.4}
.small{font-size:11px;color:#76695f;margin-top:8px}
@media(max-width:600px){.grid,.checkgrid{grid-template-columns:1fr}.wrap{padding:8px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="logoMark">M</div>
      <div class="brandName">studioby.malu</div>
    </div>

    <h1>FICHA DE ANAMNESE</h1>

    <div class="grid">
      <div class="field full"><label>NOME COMPLETO *</label><input id="nome" autocomplete="name"></div>
      <div class="field"><label>DATA DE NASCIMENTO</label><input id="nascimento" type="date"></div>
      <div class="field">
        <label>PROCEDIMENTO</label>
        <select id="procedimento">
          <option value="">Selecione o procedimento</option>
          <option>Design personalizado com Henna</option>
          <option>Design Tradicional</option>
          <option>Brow Up</option>
          <option>Brow Lamination</option>
          <option>Henna Lips</option>
          <option>Combo Lábios</option>
          <option>Vibromassagem Terapêutica</option>
          <option>SPA Labial</option>
        </select>
      </div>
    </div>

    <div id="hennaSection" class="section" style="display:none">
      <div class="sectionTitle">SOBRANCELHAS — DESIGN PERSONALIZADO COM HENNA</div>
      <div class="grid">
        <div class="field full">
          <label>JÁ UTILIZOU HENNA OU TINTURA NAS SOBRANCELHAS?</label>
          <div class="checkgrid">
            <label class="check"><input type="radio" name="jaHennaTintura" value="Sim"><span>Sim</span></label>
            <label class="check"><input type="radio" name="jaHennaTintura" value="Não"><span>Não</span></label>
          </div>
        </div>
        <div class="field full">
          <label>SE SIM, LEMBRA SE HOUVE ALGUMA REAÇÃO?</label>
          <div class="checkgrid">
            <label class="check"><input type="radio" name="reacaoHennaTintura" value="Sim"><span>Sim</span></label>
            <label class="check"><input type="radio" name="reacaoHennaTintura" value="Não"><span>Não</span></label>
            <label class="check"><input type="radio" name="reacaoHennaTintura" value="Não lembro"><span>Não lembro</span></label>
          </div>
        </div>
        <div class="field full">
          <label>SE HOUVE REAÇÃO, QUAL?</label>
          <textarea id="detalheReacaoHenna" placeholder="Ex.: vermelhidão, coceira, ardência, inchaço ou outra reação."></textarea>
        </div>
        <div class="field full">
          <label>OBSERVAÇÕES SOBRE AS SOBRANCELHAS</label>
          <textarea id="observacoesSobrancelhas" placeholder="Conte o que considerar importante sobre o histórico ou preferências das sobrancelhas."></textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sectionTitle">SAÚDE E SEGURANÇA</div>
      <div class="checkgrid">
        <label class="check"><input type="checkbox" id="diabetes"><span>Diabetes</span></label>
        <label class="check"><input type="checkbox" id="hipertensao"><span>Hipertensão</span></label>
        <label class="check"><input type="checkbox" id="gestante"><span>Gestante / amamentando</span></label>
        <label class="check"><input type="checkbox" id="peleSensivel"><span>Pele sensível / reativa</span></label>
        <label class="check"><input type="checkbox" id="dermatite"><span>Dermatite / eczema</span></label>
        <label class="check"><input type="checkbox" id="herpes"><span>Herpes na região</span></label>
        <label class="check"><input type="checkbox" id="medicacao"><span>Uso de medicação</span></label>
        <label class="check"><input type="checkbox" id="tratamento"><span>Tratamento dermatológico</span></label>
        <label class="check"><input type="checkbox" id="alergia"><span>Alergia conhecida</span></label>
        <label class="check"><input type="checkbox" id="procedimentoAnterior"><span>Procedimento recente na região</span></label>
      </div>
      <div class="grid" style="margin-top:12px">
        <div class="field full"><label>ALERGIAS / REAÇÕES / MEDICAMENTOS / CONDIÇÕES DE SAÚDE — ESPECIFIQUE</label><textarea id="saude"></textarea></div>
        <div class="field full"><label>OUTRAS INFORMAÇÕES IMPORTANTES</label><textarea id="observacoes"></textarea></div>
      </div>
    </div>

    <div id="sobrancelhasSection" class="section" style="display:none">
      <div class="sectionTitle">SOBRANCELHAS</div>
      <div class="grid">
        <div class="field full">
          <label>POSSUI ATUALMENTE ALGUMA ALTERAÇÃO NA REGIÃO DAS SOBRANCELHAS?</label>
          <div class="checkgrid">
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Não"> <span>Não</span></label>
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Ferida ou corte"> <span>Ferida ou corte</span></label>
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Acne / inflamação"> <span>Acne / inflamação</span></label>
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Irritação / descamação"> <span>Irritação / descamação</span></label>
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Queda de pelos excessiva"> <span>Queda de pelos excessiva</span></label>
            <label class="check"><input type="checkbox" name="alteracaoSobrancelhas" value="Outra"> <span>Outra</span></label>
          </div>
        </div>

        <div class="field full">
          <label>QUANDO FOI SEU ÚLTIMO DESIGN?</label>
          <div class="checkgrid">
            <label class="check"><input type="radio" name="ultimoDesign" value="Menos de 15 dias"> <span>Menos de 15 dias</span></label>
            <label class="check"><input type="radio" name="ultimoDesign" value="15 a 30 dias"> <span>15 a 30 dias</span></label>
            <label class="check"><input type="radio" name="ultimoDesign" value="Mais de 30 dias"> <span>Mais de 30 dias</span></label>
            <label class="check"><input type="radio" name="ultimoDesign" value="Não lembro"> <span>Não lembro</span></label>
          </div>
        </div>

        <div class="field full">
          <label>QUAL RESULTADO VOCÊ DESEJA?</label>
          <div class="checkgrid">
            <label class="check"><input type="checkbox" name="resultadoDesejado" value="Natural"> <span>Natural</span></label>
            <label class="check"><input type="checkbox" name="resultadoDesejado" value="Mais definida"> <span>Mais definida</span></label>
            <label class="check"><input type="checkbox" name="resultadoDesejado" value="Corrigir formato"> <span>Corrigir formato</span></label>
            <label class="check"><input type="checkbox" name="resultadoDesejado" value="Deixar crescer"> <span>Deixar crescer</span></label>
          </div>
        </div>
      </div>
    </div>

    <div class="consent">
      <div class="consentRow">
        <input type="checkbox" id="autorizacaoProcedimento" required>
        <label for="autorizacaoProcedimento" class="consentText">
          <strong>AUTORIZAÇÃO PARA REALIZAÇÃO DO PROCEDIMENTO *</strong>
          Autorizo a realização do procedimento selecionado nesta ficha. Declaro que respondi com sinceridade às perguntas e informei todas as condições de saúde, alergias, medicamentos e reações de que tenho conhecimento.
        </label>
      </div>
      <div class="consentRow" style="margin-top:12px">
        <input type="checkbox" id="autorizacao">
        <label for="autorizacao" class="consentText">
          <strong>AUTORIZAÇÃO DE USO DE IMAGEM (OPCIONAL)</strong>
          Autorizo o registro e o uso de imagens e gravações realizadas durante o atendimento para fins de divulgação do trabalho do <b>studioby.malu</b>.
        </label>
      </div>
      <div class="small">A autorização para o procedimento é obrigatória para enviar a ficha. A autorização de uso de imagem é opcional; se não marcar, o PDF registrará que o uso de imagem não foi autorizado.</div>
    </div>

    <div class="actions">
      <button id="enviar" class="primary" type="button">ENVIAR FICHA</button>
      <div id="status" class="status"></div>
    </div>
  </div>
</div>

function mensagem(d){return `Olá! Aqui é o studioby.malu.\n\nFicha de anamnese da cliente: ${d.nome}.\nPDF da ficha preenchida segue em anexo.\n\nAutorização para procedimento: ${d.autorizouProcedimento?"AUTORIZADA":"NÃO CONFIRMADA"}.\nAutorização de imagem: ${d.autorizou?"AUTORIZADA":"NÃO AUTORIZADA"}.`;}
async function compartilharOuBaixar(blob,d){
  const file=new File([blob],`Ficha_${(d.nome||"cliente").replace(/[^a-zA-Z0-9À-ÿ]+/g,"_")}_studioby.malu.pdf`,{type:"application/pdf"});
  const msg=mensagem(d);
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){try{await navigator.share({title:"Ficha studioby.malu",text:msg,files:[file]});return "shared";}catch(e){if(e.name==="AbortError")return "cancelled";}}
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const url=URL.createObjectURL(blob);
  if(isIOS){window.open(url,"_blank");return "ios";}
  const a=document.createElement("a");a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return "download";
}
